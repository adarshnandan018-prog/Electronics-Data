<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRRONICS BRANCH DATA</title>
</head>
<body>
    <h1>1st Year Electronics Branch Data</h1>

    <form action="/submit" method="post">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="branch">Branch</label>
            <input type="text" id="branch" name="branch" placeholder="Enter branch name" required>
        </div>

        <div>
            <label for="registration">Registration No.</label>
            <input type="text" id="registration" name="ent" placeholder="Enter registration no." required>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
